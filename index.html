<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark; background: #050812;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/mcu-icon.jpg" />
    <link rel="apple-touch-icon" href="/mcu-icon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#050812" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="dark" />
    
    <!-- Fonts: preloaded then applied asynchronously so text renders immediately -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" /></noscript>
    
    <!-- Prevent white flash on load -->
    <style>
      html, body, #root {
        background: #050812 !important;
        color: #f5fffd;
        margin: 0;
        padding: 0;
      }
      /* Critical loading styles to prevent white flash */
      html::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -10;
        background: 
          radial-gradient(circle at 18% 8%, rgba(124,255,218,0.25), transparent 35%),
          radial-gradient(circle at 82% 22%, rgba(154,134,255,0.20), transparent 40%),
          linear-gradient(155deg, #050812 0%, #0b1936 38%, #25114e 70%, #083d3b 100%);
      }
    </style>
    
    <meta name="description" content="Find the best viewing order for Marvel, DC, X-Men, and Sony superhero films and series." />
    <meta name="author" content="MCU Viewing Order" />
    <meta property="og:title" content="MCU Viewing Order | Superhero Timeline Guide" />
    <meta property="og:description" content="Explore superhero timelines, track your watch progress, and discover what to watch next." />
    <meta property="og:image" content="https://mcu-viewing-order.vercel.app/og-image.jpg" />
    <meta property="og:url" content="https://mcu-viewing-order.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>MCU Viewing Order | Superhero Timeline Guide</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
