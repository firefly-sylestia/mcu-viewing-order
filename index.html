<!doctype html>
<html lang="en" style="color-scheme: light; background: #f6f7fb;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/mcu-icon.jpg" sizes="any" />
    <link rel="apple-touch-icon" href="/mcu-icon.jpg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Incursion" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f6f7fb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="light" />
    
    <!-- Fonts: preloaded then applied asynchronously so text renders immediately -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" /></noscript>
    
    <!-- Apply the light default immediately to avoid a dark flash before the app mounts. -->
    <style>
      html, body, #root {
        background: #f6f7fb !important;
        color: #171b26;
        margin: 0;
        padding: 0;
      }
      html::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -10;
        background:
          radial-gradient(circle at 18% 8%, rgba(124, 145, 255, .10), transparent 35%),
          radial-gradient(circle at 82% 22%, rgba(255, 133, 153, .08), transparent 40%),
          linear-gradient(155deg, #f8f9fc 0%, #f1f3f9 58%, #f7f5fb 100%);
      }
    </style>
    
    <meta name="description" content="Find the best viewing order for Marvel, DC, X-Men, and Sony superhero films and series." />
    <meta name="author" content="Incursion" />
    <meta property="og:title" content="Incursion | Superhero Timeline Guide" />
    <meta property="og:description" content="Explore superhero timelines, track your watch progress, and discover what to watch next." />
    <meta property="og:image" content="https://mcu-viewing-order.vercel.app/og-image.jpg" />
    <meta property="og:url" content="https://mcu-viewing-order.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Incursion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
