name: Refresh Superman Poster
# Re-run the one-time local artwork refresh after the manifest correction.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-superman-poster.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download the official TMDB poster into the local assets folder
        run: node scripts/fetch-posters.mjs --force --only=superman

      - name: Commit the local poster and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/posters/5022-superman.jpg public/posters/posters.json
          if git diff --cached --quiet; then
            echo "No poster changes to commit"
          else
            git commit -m "Replace Superman poster with local TMDB artwork"
            git push
          fi
